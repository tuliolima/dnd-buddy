<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magias — D&D Buddy</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav>
      <div class="nav-inner">
        <a href="index.html" class="nav-logo">⚔ D&D Buddy</a>
        <div class="nav-links">
          <a href="spells.html" class="nav-link" data-page="spells">Magias</a>
          <a href="classes.html" class="nav-link" data-page="classes">Classes</a>
          <a href="species.html" class="nav-link" data-page="species">Espécies</a>
        </div>
        <a href="favorites.html" class="nav-fav-badge" id="nav-fav-badge">
          ★ <span class="fav-count"></span>
        </a>
      </div>
    </nav>

    <main>
      <h1 class="page-title">✨ Magias</h1>
      <p class="page-subtitle">
        Busque e filtre as magias disponíveis. Clique em qualquer card para ver
        os detalhes completos.
      </p>

      <div class="filters" id="filters">
        <input
          type="search"
          id="search"
          class="search-input"
          placeholder="Buscar por nome..."
        />
        <select id="filter-level" class="filter-select">
          <option value="">Todos os círculos</option>
          <option value="0">Truques (Círculo 0)</option>
          <option value="1">1° Círculo</option>
          <option value="2">2° Círculo</option>
          <option value="3">3° Círculo</option>
          <option value="4">4° Círculo</option>
          <option value="5">5° Círculo</option>
          <option value="6">6° Círculo</option>
          <option value="7">7° Círculo</option>
          <option value="8">8° Círculo</option>
          <option value="9">9° Círculo</option>
        </select>
        <select id="filter-school" class="filter-select">
          <option value="">Todas as escolas</option>
        </select>
        <select id="filter-class" class="filter-select">
          <option value="">Todas as classes</option>
        </select>
        <button id="filter-favs" class="filter-fav-btn">
          ☆ Apenas favoritos
        </button>
        <select id="sort-order" class="filter-select">
          <option value="alpha">A–Z</option>
          <option value="circulo">Por círculo</option>
        </select>
        <p class="results-count" id="results-count"></p>
      </div>

      <div class="cards-grid" id="cards-grid">
        <div class="loading">
          Carregando magias <span class="spinner"></span>
        </div>
      </div>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/spells.js"></script>
  </body>
</html>
